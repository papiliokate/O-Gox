name: Daily Video Generation

on:
  repository_dispatch:
    types: [generate-daily-video]
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Randomize Video Format
        run: |
          FORMATS=("standard" "fail" "interactive" "standard")
          SELECTED_FORMAT=${FORMATS[$(( $RANDOM % 4 ))]}
          echo "Selected Format: $SELECTED_FORMAT"
          echo "FORMAT=$SELECTED_FORMAT" >> $GITHUB_ENV



      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          
      - name: Install Puppeteer System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev xvfb ffmpeg

      - name: Generate Video
        run: xvfb-run --auto-servernum --server-args="-screen 0 720x1280x24" node scripts/generate_video.js
        env:
          HEADLESS: "false"

      - name: Build Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:o-gox --project go-rabbit-4af82 --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Ping Zapier Webhook
        run: |
          CAPTIONS=(
            "Can you spell today's animal before the rings spin too fast? 🐯 Play free at oops-games-hub.web.app"
            "Only 5% of players can get a perfect score! Test your aim at oops-games-hub.web.app 🎯"
            "Today's O-Gox Challenge! 🧠 Can you figure it out? Play free at oops-games-hub.web.app"
          )
          YOUTUBE_TITLES=(
            "Can You Spell Today's Animal? (#Shorts)"
            "Fastest Way To Solve O-Gox (#Puzzle)"
            "Daily Animal Spelling Puzzle (#Gaming)"
          )
          R_INDEX=$(( $RANDOM % 3 ))
          CAPTION="${CAPTIONS[$R_INDEX]} #OGox #DailyPuzzle #WordGame #"$(date +'%Y%m%d')
          YT_TITLE="${YOUTUBE_TITLES[$R_INDEX]}"
          TS=$(date +'%s')
          
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" \
          -d "{\"video_url\": \"https://o-gox.web.app/daily_video.mp4?t=$TS\", \"text\": \"$CAPTION\", \"youtube_title\": \"$YT_TITLE\", \"target_channel\": \"all\"}" \
          https://hooks.zapier.com/hooks/catch/27231889/ujm5mjh/ || exit 1
          
          echo "Deployed public video and pinged Zapier!"
